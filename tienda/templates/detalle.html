<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ producto.nombre }} - LogisFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --ink: #34233d; --brand: #b4487a; }
        body { color: var(--ink); background: radial-gradient(circle at top right, #fbe2ee 0, transparent 30rem), #fcf7fa !important; }
        .product-nav { background: #34233d; }
        .product-card { border: 0; border-radius: 24px; box-shadow: 0 16px 40px rgba(75,36,64,.10); }
        .product-photo { max-height: 500px; width: 100%; object-fit: cover; border-radius: 18px; }
        .price { color: #b4487a; }
        .form-select:focus, .form-control:focus { border-color: #df91b4; box-shadow: 0 0 0 .2rem rgba(180,72,122,.12); }
        .btn-primary { --bs-btn-bg: #b4487a; --bs-btn-border-color: #b4487a; --bs-btn-hover-bg: #93365f; --bs-btn-hover-border-color: #93365f; }
    </style>
</head>
<body class="bg-light">

    <!-- Navegación -->
    <nav class="navbar navbar-dark product-nav mb-4 shadow-sm py-3">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'catalogo' %}"><i class="bi bi-box-seam me-2"></i>LogisFlow Tienda</a>
            <a href="{% url 'ver_carrito' %}" class="btn btn-outline-light"><i class="bi bi-cart3 me-2"></i>Mi Carrito</a>
        </div>
    </nav>

    <div class="container pb-5">
        <div class="mb-3">
            <a href="{% url 'catalogo' %}" class="text-decoration-none text-secondary"><i class="bi bi-arrow-left me-1"></i> Volver al catálogo</a>
        </div>

        <div class="row bg-white product-card p-4 p-lg-5">
            <!-- FOTO DEL PRODUCTO -->
            <div class="col-md-6 text-center">
                {% if producto.imagen %}
                    <img src="{{ producto.imagen.url }}" alt="{{ producto.nombre }}" class="product-photo shadow-sm">
                {% else %}
                    <div class="bg-light rounded-3 d-flex align-items-center justify-content-center" style="height: 400px;">
                        <i class="bi bi-image text-secondary" style="font-size: 5rem;"></i>
                    </div>
                {% endif %}
            </div>

            <!-- DETALLES Y FORMULARIO -->
            <div class="col-md-6 d-flex flex-column justify-content-center mt-4 mt-md-0">
                <h1 class="fw-bold">{{ producto.nombre }}</h1>
                <h2 class="price fw-bold mb-4">${{ producto.precio }}</h2>
                
                <hr>

                <!-- FORMULARIO DE CARRITO (AHORA EXIGE VARIANTE) -->
                <form action="{% url 'agregar_carrito' producto.id %}" method="post" class="mt-3">
                    {% csrf_token %}
                    
                    <div class="mb-4">
                        <label class="form-label fw-bold">Selecciona tu Talla:</label>
                        <select name="variante_id" class="form-select form-select-lg" required>
                            <option value="">-- Elige una opción --</option>
                            {% for variante in producto.variantes.all %}
                                <!-- Bloquea la opción si no hay stock -->
                                <option value="{{ variante.id }}" {% if variante.stock_disponible <= 0 %}disabled{% endif %}>
                                    Talla {{ variante.talla }} 
                                    {% if variante.stock_disponible <= 0 %}
                                        (Agotado)
                                    {% elif variante.stock_disponible <= 3 %}
                                        (¡Últimas {{ variante.stock_disponible }}!)
                                    {% else %}
                                        (En stock)
                                    {% endif %}
                                </option>
                            {% empty %}
                                <option value="" disabled>Sin stock registrado actualmente</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">Cantidad:</label>
                        <input type="number" name="cantidad" value="1" min="1" class="form-control" style="max-width: 100px;">
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold rounded-pill">
                        <i class="bi bi-cart-plus me-2"></i>Agregar al Carrito
                    </button>
                </form>

            </div>
        </div>
    </div>
</body>
</html>
