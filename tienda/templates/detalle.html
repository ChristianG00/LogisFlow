<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ producto.nombre }} - LogisFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <!-- Navegación -->
    <nav class="navbar navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'catalogo' %}"><i class="bi bi-box-seam me-2"></i>LogisFlow Tienda</a>
            <a href="{% url 'ver_carrito' %}" class="btn btn-outline-light"><i class="bi bi-cart3 me-2"></i>Mi Carrito</a>
        </div>
    </nav>

    <div class="container pb-5">
        <div class="mb-3">
            <a href="{% url 'catalogo' %}" class="text-decoration-none text-secondary"><i class="bi bi-arrow-left me-1"></i> Volver al catálogo</a>
        </div>

        <div class="row bg-white rounded-4 shadow-sm p-4">
            <!-- FOTO DEL PRODUCTO -->
            <div class="col-md-6 text-center">
                {% if producto.imagen %}
                    <img src="{{ producto.imagen.url }}" alt="{{ producto.nombre }}" class="img-fluid rounded-3 shadow-sm" style="max-height: 500px; object-fit: cover;">
                {% else %}
                    <div class="bg-light rounded-3 d-flex align-items-center justify-content-center" style="height: 400px;">
                        <i class="bi bi-image text-secondary" style="font-size: 5rem;"></i>
                    </div>
                {% endif %}
            </div>

            <!-- DETALLES Y FORMULARIO -->
            <div class="col-md-6 d-flex flex-column justify-content-center mt-4 mt-md-0">
                <span class="badge bg-dark mb-2" style="width: fit-content;">SKU: {{ producto.sku }}</span>
                <h1 class="fw-bold">{{ producto.nombre }}</h1>
                <h2 class="text-success fw-bold mb-4">${{ producto.precio }}</h2>
                
                <hr>

                <!-- FORMULARIO DE CARRITO (AHORA EXIGE VARIANTE) -->
                <form action="{% url 'agregar_carrito' producto.id %}" method="post" class="mt-3">
                    {% csrf_token %}
                    
                    <div class="mb-4">
                        <label class="form-label fw-bold">Selecciona tu Talla:</label>
                        <select name="variante_id" class="form-select form-select-lg border-dark" required>
                            <option value="">-- Elige una opción --</option>
                            {% for variante in producto.variantes.all %}
                                <!-- Bloquea la opción si no hay stock -->
                                <option value="{{ variante.id }}" {% if variante.stock <= 0 %}disabled{% endif %}>
                                    Talla {{ variante.talla }} 
                                    {% if variante.stock <= 0 %}
                                        (Agotado)
                                    {% elif variante.stock <= 3 %}
                                        (¡Últimas {{ variante.stock }}!)
                                    {% else %}
                                        (En stock)
                                    {% endif %}
                                </option>
                            {% empty %}
                                <option value="" disabled>Sin stock registrado actualmente</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">Cantidad:</label>
                        <input type="number" name="cantidad" value="1" min="1" class="form-control" style="max-width: 100px;">
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold rounded-pill">
                        <i class="bi bi-cart-plus me-2"></i>Agregar al Carrito
                    </button>
                </form>

            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
