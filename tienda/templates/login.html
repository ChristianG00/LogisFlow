<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso Administrativo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #212529; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: white; border-radius: 15px; overflow: hidden; max-width: 900px; width: 100%; box-shadow: 0 15px 30px rgba(0,0,0,0.5); }
        .bg-image { background: linear-gradient(135deg, #0d6efd, #0dcaf0); padding: 40px; color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="row login-card mx-auto">
                    <!-- Mitad Imagen/Branding -->
                    <div class="col-md-6 bg-image d-none d-md-flex">
                        <i class="bi bi-box-seam display-1 mb-3"></i>
                        <h2 class="fw-bold">LOGISFLOW Admin</h2>
                        <p>Plataforma de gestión de inventario y despachos.</p>
                    </div>
                    
                    <!-- Mitad Formulario -->
                    <div class="col-md-6 p-5">
                        <div class="text-center mb-4 d-md-none">
                            <h3 class="text-primary fw-bold">LOGISFLOW</h3>
                        </div>
                        <h4 class="fw-bold text-dark mb-4">Iniciar Sesión</h4>
                        
                        <form method="post" action="{% url 'login' %}">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label fw-bold text-muted">Usuario</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                                    <input type="text" name="username" class="form-control" placeholder="admin" required>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-bold text-muted">Contraseña</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                                </div>
                            </div>
                            
                            <!-- Manejo de errores de login -->
                            {% if form.errors %}
                                <div class="alert alert-danger p-2 text-center small">Usuario o contraseña incorrectos.</div>
                            {% endif %}

                            <button type="submit" class="btn btn-dark w-100 py-2 fw-bold">Ingresar al Sistema</button>
                        </form>
                        <div class="text-center mt-4">
                            <a href="{% url 'catalogo' %}" class="text-muted text-decoration-none small"><i class="bi bi-arrow-left me-1"></i> Volver a la tienda pública</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
