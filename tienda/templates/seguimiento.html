<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rastrear Pedido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow">
                    <div class="card-header bg-info text-white">
                        <h4 class="mb-0">Rastrear mi Pedido</h4>
                    </div>
                    <div class="card-body">
                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="rut" class="form-label">Ingresa tu RUT:</label>
                                <input type="text" class="form-control" name="rut" placeholder="Ej: 12345678-9" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Buscar Pedido</button>
                        </form>

                        {% if error %}
                            <div class="alert alert-danger mt-3">{{ error }}</div>
                        {% endif %}

                        {% if pedido %}
                            <div class="alert alert-success mt-4 text-center">
                                <h5>Hola, {{ pedido.cliente.nombre }}</h5>
                                <p class="mb-1">Tu pedido del {{ pedido.fecha|date:"d/m/Y" }} está:</p>
                                <h3 class="text-uppercase fw-bold">{{ pedido.estado }}</h3>
                                <p class="mb-0 text-muted">Entrega: {{ pedido.get_tipo_entrega_display }}</p>
                            </div>
                        {% endif %}
                        
                        <a href="{% url 'catalogo' %}" class="btn btn-outline-secondary w-100 mt-3">Volver al catálogo</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
